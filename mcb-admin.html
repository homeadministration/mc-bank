<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCB | Адмін-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --pb-green: #70b33e; --pb-dark: #212121; --danger: #e74c3c; }
        body { background: #f4f6f8; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        
        #admin-lock {
            position: fixed; top:0; left:0; width:100%; height:100%; background: var(--pb-dark);
            z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; color: white;
        }

        .admin-container { max-width: 1200px; margin: 0 auto; display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        .stat-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        th { background: #eee; padding: 15px; text-align: left; font-size: 12px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }

        .btn { padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Inter'; font-size: 12px; transition: 0.2s; }
        .btn-edit { background: #3498db; color: white; }
        .btn-block { background: var(--pb-dark); color: white; }
        .btn-unblock { background: var(--pb-green); color: white; }
        .btn-delete { background: var(--danger); color: white; }

        .tax-panel { background: #fff; padding: 25px; border-radius: 15px; margin-bottom: 30px; border-left: 5px solid var(--pb-green); }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-right: 10px; font-family: 'Inter'; }
        
        .status-blocked { color: var(--danger); font-weight: bold; }
        .status-active { color: var(--pb-green); font-weight: bold; }
    </style>
</head>
<body>

<div id="admin-lock">
    <h2 style="font-family: Montserrat;">ВХІД В СИСТЕМУ КЕРУВАННЯ</h2>
    <input type="password" id="admin-pass" placeholder="Введіть пароль" style="text-align: center; font-size: 20px;">
    <button onclick="checkPass()" class="btn" style="background: var(--pb-green); padding: 15px 40px; margin-top: 15px; color: white;">УВІЙТИ</button>
</div>

<div class="admin-container" id="admin-content">
    <div class="header">
        <h1 style="font-family: Montserrat; font-weight: 900;">ADMIN <span style="color: var(--pb-green);">CORE</span></h1>
        <button onclick="location.reload()" class="btn btn-edit">Оновити базу</button>
    </div>

    <div class="tax-panel">
        <h3 style="margin-top: 0; font-family: Montserrat;">⚙️ Налаштування циклічного податку</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
            <input type="number" id="tax-amount" placeholder="Сума ¥">
            <input type="text" id="tax-reason" placeholder="Причина (напр. Оренда)">
            <input type="number" id="tax-interval" placeholder="Інтервал (сек)">
            <input type="number" id="tax-cycles" placeholder="Кількість циклів">
            <button class="btn" style="background: var(--pb-dark); color: white;" onclick="startTaxCycle()">ЗАПУСТИТИ ЗБІР</button>
        </div>
        <p id="tax-status" style="font-size: 12px; color: #666; margin-top: 10px;"></p>
    </div>

    <div class="grid-stats">
        <div class="stat-card">
            <div style="font-size: 12px; color: #888;">Всього юзерів</div>
            <div id="total-users" style="font-size: 24px; font-weight: 900;">0</div>
        </div>
        <div class="stat-card">
            <div style="font-size: 12px; color: #888;">Загальний капітал</div>
            <div id="total-money" style="font-size: 24px; font-weight: 900; color: var(--pb-green);">¥ 0</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Нікнейм</th>
                <th>ID</th>
                <th>Баланс</th>
                <th>Статус</th>
                <th>Дії</th>
            </tr>
        </thead>
        <tbody id="users-table"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, increment, addDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBCuIp95A78sJ3xZNEkezi_ms6cMrUa434",
        authDomain: "mc-bank-a2faa.firebaseapp.com",
        projectId: "mc-bank-a2faa",
        storageBucket: "mc-bank-a2faa.firebasestorage.app",
        messagingSenderId: "326207868586",
        appId: "1:326207868586:web:ba9a71626d58d9de68cad3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.checkPass = () => {
        if(document.getElementById('admin-pass').value === '6767') {
            document.getElementById('admin-lock').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadUsers();
        } else {
            alert("Невірний пароль!");
        }
    }

    async function loadUsers() {
        const querySnapshot = await getDocs(collection(db, "users"));
        const table = document.getElementById('users-table');
        table.innerHTML = "";
        
        let totalM = 0;
        let count = 0;

        querySnapshot.forEach((docSnap) => {
            const user = docSnap.data();
            const uid = docSnap.id;
            totalM += user.balance || 0;
            count++;

            const row = `
                <tr>
                    <td><b>${user.nickname}</b></td>
                    <td><code>${user.shortID}</code></td>
                    <td>¥ ${user.balance.toFixed(2)}</td>
                    <td>${user.isBlocked ? '<span class="status-blocked">ЗАБЛОКОВАНО</span>' : '<span class="status-active">АКТИВНА</span>'}</td>
                    <td>
                        <button class="btn btn-edit" onclick="adminAddMoney('${uid}', '${user.nickname}')">Нарахувати</button>
                        <button class="btn ${user.isBlocked ? 'btn-unblock' : 'btn-block'}" onclick="toggleBlock('${uid}', ${user.isBlocked || false})">
                            ${user.isBlocked ? 'Розблокувати' : 'БЛОКНУТИ'}
                        </button>
                        <button class="btn btn-delete" onclick="deleteUser('${uid}', '${user.nickname}')">ВИДАЛИТИ</button>
                    </td>
                </tr>
            `;
            table.innerHTML += row;
        });

        document.getElementById('total-users').innerText = count;
        document.getElementById('total-money').innerText = `¥ ${totalM.toLocaleString()}`;
    }

    // ВИДАЛЕННЯ ГРАВЦЯ
    window.deleteUser = async (uid, nickname) => {
        const confirmDelete = confirm(`ВИ ВПЕВНЕНІ? \nГравець ${nickname} буде повністю видалений з бази даних. Цю дію неможливо скасувати!`);
        
        if (confirmDelete) {
            try {
                await deleteDoc(doc(db, "users", uid));
                alert(`Гравця ${nickname} успішно видалено.`);
                loadUsers();
            } catch (error) {
                console.error("Помилка при видаленні:", error);
                alert("Сталася помилка при видаленні гравця.");
            }
        }
    };

    // НАРАХУВАННЯ ГРОШЕЙ
    window.adminAddMoney = async (uid, nickname) => {
        const amount = prompt(`Сума для ${nickname} (від'ємна для зняття):`);
        const reason = prompt(`Причина нарахування:`, "Адмін-корекція");
        
        if (amount && !isNaN(amount)) {
            const val = parseFloat(amount);
            await updateDoc(doc(db, "users", uid), { balance: increment(val) });

            await addDoc(collection(db, "transactions"), {
                amount: Math.abs(val),
                senderUid: val > 0 ? "ADMIN_SYSTEM" : uid,
                senderNick: val > 0 ? "СИСТЕМА" : nickname,
                receiverUid: val > 0 ? uid : "ADMIN_SYSTEM",
                receiverNick: val > 0 ? nickname : "СИСТЕМА (Зняття)",
                reason: reason,
                timestamp: serverTimestamp(),
                participants: [uid, "ADMIN_SYSTEM"]
            });

            alert("Успішно!");
            loadUsers();
        }
    };

    window.toggleBlock = async (uid, currentStatus) => {
        await updateDoc(doc(db, "users", uid), { isBlocked: !currentStatus });
        loadUsers();
    };

    window.startTaxCycle = async () => {
        const amount = parseFloat(document.getElementById('tax-amount').value);
        const reason = document.getElementById('tax-reason').value || "Податок";
        const interval = parseInt(document.getElementById('tax-interval').value) * 1000;
        let cycles = parseInt(document.getElementById('tax-cycles').value);

        if(!amount || !interval || !cycles) return alert("Заповніть всі поля!");

        document.getElementById('tax-status').innerText = `Запущено збір: ${cycles} разів по ¥${amount}`;

        const timer = setInterval(async () => {
            if(cycles <= 0) {
                clearInterval(timer);
                document.getElementById('tax-status').innerText = "Збір завершено.";
                return;
            }

            const users = await getDocs(collection(db, "users"));
            for (const uDoc of users.docs) {
                const userData = uDoc.data();
                await updateDoc(doc(db, "users", uDoc.id), { balance: increment(-amount) });
                await addDoc(collection(db, "transactions"), {
                    amount: amount,
                    senderUid: uDoc.id,
                    senderNick: userData.nickname,
                    receiverUid: "TREASURY",
                    receiverNick: "Державна Казна",
                    reason: `Податок: ${reason}`,
                    timestamp: serverTimestamp(),
                    participants: [uDoc.id, "TREASURY"]
                });
            }
            cycles--;
            document.getElementById('tax-status').innerText = `Залишилось циклів: ${cycles}.`;
            loadUsers();
        }, interval);
    };

</script>
</body>
</html>
